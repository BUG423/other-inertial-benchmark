# 动态完整矩阵：全部 active profiles × 全部独立 accepted native × 同一三个 OS 随机种子。
# XYZ 主协议、XY 论文参考、经典标定、人体/UAV/跨域和特权输入均保留覆盖状态。
# raw partial 不计 ready；未验收、test-only 缺指定 checkpoint、资源失败均显式 pending/blocked。
# 用法：ipb benchmark cfg=main device=0；输出 runs/benchmark/main/<model>/<dataset>/seed<k>/
name: main
project: runs/benchmark
models: all_active_profiles
datasets: accepted_native
seeds: random_record
native_registry: .local/reports/formal-native-registry.json
seed_record: .local/plans/random-seeds.json
policy: .local/plans/frozen-main-policy.json
admission: .local/matrix/main/coverage.json
splits:                 # 缺省使用各数据集 YAML 的 test_splits
overrides:
  recipe: unified
  device: "0"
report: true
continue_on_error: true
