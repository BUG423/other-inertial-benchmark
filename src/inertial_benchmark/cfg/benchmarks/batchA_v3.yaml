# IPB v1 batch A v3：12 个代表性学习方法 + 2 个经典基线 × 3 个低成本数据集 × seed 0。
#
# v2 的首次完整遍历得到 35/42 个有限 val 结果；GNIO 2 项、TLIO 3 项、LLIO 2 项因
# heteroscedastic NLL 的有限前向 / NaN 反向路径失败。v3 只改变代数等价的 NLL 精度写法
# ``error * exp(-2u)`` 并在 optimizer step 前检查梯度有限性。为保持单一代码版本，v3 必须
# 从零运行，不复用或混入 v2 结果。固定代码版本仍须使用独立 detached worktree。
#
# 模型、数据、预算、随机种子和评测协议与 v2 完全相同，使 v2→v3 只有一个受控变量。
# 矩阵只评 val；绝不触碰 test。
name: batchA_v3
project: /workspace/webCodex/ipb-runs/benchmark
datasets: [ridi, imunet, rnin]
seeds: [0]
splits: [val]
report: false
continue_on_error: true
models:
  - {label: pdr, model: pdr, overrides: {orientation: reference}}
  - {label: mean_speed_heading, model: mean_speed_heading,
     overrides: {orientation: reference}}
  - ronin_resnet18
  - gnio
  - velobins
  - tlio
  - rnin
  - imunet
  - deepils
  - eqnio_ronin
  - llio
  - tinyodom
  - rio
  - ionet
overrides:
  recipe: unified
  train_windows_budget: 32000000
  budget_max_epochs: 400
  fitness: ate
  fitness_stat: median
  amp: false
  deterministic: true
  device: 0
  workers: 8
  save_predictions: false
  plots: false
