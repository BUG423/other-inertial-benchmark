name: uzh_fpv
path: uzh_fpv
splits:
  test: test
test_splits: [test]
strata: [device_id, scene_id]
domain: uav
independent_source_id: uzh_fpv
reference: official_v3_vision_based_pose_Leica_validated
orientation_capabilities:
  reference: true
  device: false
notes: >-
  Independent UZH-FPV source, currently the official v3 indoor_forward_6
  Snapdragon recording. Only the time interval with both IMU and published
  pose reference is retained; the acquired subset is test-only. The v3 pose
  reference is generated by vision and its positions are validated using
  Leica measurements; attitude is not independent motion-capture truth.
  Pose is expressed at the IMU origin. Reference attitude is privileged;
  deployable device attitude is unavailable. Whole flights remain groups.
