name: lionet_3d
arch: lionet
paper: https://arxiv.org/abs/2001.04061
code: none (official architecture code not publicly located)
license: independent paper implementation
fidelity: 3d_adapted; original horizontal polar loss plus independently learned vertical velocity
args: {filters: 32, layers: 8, kernel_size: 2, decimation: 2}
input:
  window: 400
  frame: gravity_world
  orientation: reference
  remove_gravity: false
  target: avg_velocity
  dims: 3
loss: ionet_polar
loss_kwargs: {kappa: 1.0, min_speed: 0.1, vertical_weight: 1.0}
recipes:
  unified: {augment: []}
