# IPB 三维适配：原 RoNIN ResNet18 的 2D 速度头扩展为可学习 XYZ 头。
# 骨干、200 帧窗口和 MSE 保留；不是原论文二维精度复现，不兼容其 2D checkpoint。
name: ronin_resnet18_3d
arch: ronin_resnet
paper: https://arxiv.org/abs/1905.12853
code: https://github.com/Sachini/ronin
license: GPL-3.0 (official code); this implementation is written from scratch
commit: 805b7f0f28bb164ce89ada9ac05a9470dbe3d715
fidelity: 3d_adapted (learned XYZ velocity head; original protocol predicts XY)
args:
  group_sizes: [2, 2, 2, 2]
  base_plane: 64
  kernel_size: 3
  fc_dim: 512
  trans_planes: 128
  dropout: 0.5
input:
  window: 200
  frame: gravity_world
  orientation: reference
  remove_gravity: false
  target: avg_velocity
  dims: 3
recipes:
  unified: {}
