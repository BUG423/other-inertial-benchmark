name: CI

on:
  push:
  pull_request:

jobs:
  benchmark-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src tests tools
      - run: pytest -q
