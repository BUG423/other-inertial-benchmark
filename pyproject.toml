[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "other-inertial-benchmark"
dynamic = ["version"]
description = "IPB: unified data format, training framework and evaluation protocol for inertial positioning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["h5py>=3.8", "numpy>=1.23", "scipy>=1.9", "pyyaml>=6.0", "pandas>=1.5"]

[project.optional-dependencies]
idol = ["pyarrow>=10"]  # IDOL 的 .feather 文件
grandtour = ["numcodecs>=0.11"]  # GrandTour 原始 Zarr-v2 Blosc/LZ4 chunks
ridi = ["scikit-learn>=1.2"]  # RIDI train-only SVM/SVR baseline
train = ["torch>=2.0", "pandas>=1.5", "matplotlib>=3.6"]
export = ["torch>=2.0", "onnx>=1.14", "onnxruntime>=1.16"]  # verified CPU ONNX backend
test = ["pytest>=7"]
ops = ["paramiko>=3"]

[project.scripts]
ipb = "inertial_benchmark.cli:entrypoint"

[tool.hatch.version]
path = "src/inertial_benchmark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inertial_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end smoke tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
